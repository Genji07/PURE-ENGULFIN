<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XAUUSD · Pro Chart + Pattern Detection</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">
  <div class="title"><h1>XAU/USD · Pro Chart + Pattern Detection</h1><p class="sub"><span id="conn-dot" class="live-dot"></span><span id="conn-text">Sedia</span></p></div>
  <div class="price-box"><span class="sym">XAU/USD</span><span class="px" id="live-price">—</span><span class="chg muted" id="live-change">—</span></div>
</div>
<section class="config">
  <label>Timeframe<select id="sel-interval"><option value="1m">1m</option><option value="5m" selected>5m</option><option value="15m">15m</option><option value="30m">30m</option><option value="1h">1H</option><option value="4h">4H</option><option value="1d">1D</option></select></label>
  <label>Definisi Engulfing<select id="sel-eng-def"><option value="body" selected>Badan sahaja</option><option value="full">Badan + Sumbu</option></select></label>
  <label>Auto-refresh<select id="sel-poll"><option value="5000">5s</option><option value="10000" selected>10s</option><option value="30000">30s</option><option value="60000">60s</option></select></label>
  <label>Bilangan candle<select id="sel-limit"><option value="100">100</option><option value="200" selected>200</option><option value="300">300</option></select></label>
  <div class="btn-row"><button id="btn-start" class="green">▶ Start</button><button id="btn-stop" class="ghost" disabled>■ Stop</button><button id="btn-realtime" class="ghost">⇥ Realtime</button><button id="btn-reset" class="ghost">⟲ Reset</button></div>
</section>
<div class="chart-wrap">
  <canvas id="chart"></canvas>
  <div class="chart-hud" id="hud"><div><span class="sym">XAUUSD</span><span class="tf" id="hud-tf">5m</span></div><div class="ohlc" id="hud-ohlc"><span><span class="lbl">O</span>—</span><span><span class="lbl">H</span>—</span><span><span class="lbl">L</span>—</span><span><span class="lbl">C</span>—</span></div><div class="eng-line" id="hud-eng"><span class="dim">Corak: belum dikesan</span></div></div>
  <div class="hint">Scroll / pinch = zoom · Drag = pan · Double-click = reset</div>
</div>
<footer>Corak visual: Bullish/Bearish Engulfing · Pin Bar · Doji. Data feed pihak ketiga; bukan arahan dagangan.</footer>
<script src="js/script.js"></script>
</body>
</html>
